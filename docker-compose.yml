services:
  strangle-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifty_strangle_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Mount data directory so trades_today.json state persists across container restarts
      - ./data:/app/data
      # Mount logs directory so detailed event logs persist directly on the host machine
      - ./logs:/app/logs
      # Mount .env so generated Kite access tokens stay synchronized between host and container
      - ./.env:/app/.env
      # Code is baked into the image; rebuild to apply code changes: docker compose up -d --build
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production (10 Lots, Single-Leg Exit + Cost Trailing, Morning Trend Filter, ATR Strikes):
    command: ["--live", "--lots", "12", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "12000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 2. Live Conservative / Re-entry (5 Lots, Rs 5k Risk Cap, Single-Leg Exit + Cost Trailing):
    # command: ["--live", "--lots", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "5000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 3. Live Incubation (1 Lot, Rs 1k Portfolio Max Loss, Marketable Limit Orders):
    # command: ["--live", "--lots", "1", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "1000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 4. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "10", "--poll", "5", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    # -----------------------------------------------------------------------------------

  stock-futures-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_futures_desk
    image: ${DOCKER_USER:-sharadprsn}/stock_futures_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
      - STOCK_FUTURES_LOTS=${STOCK_FUTURES_LOTS:-2}
      - STOCK_FUTURES_ORDER_TYPE=${STOCK_FUTURES_ORDER_TYPE:-LIMIT}
      - STOCK_FUTURES_LIMIT_BUFFER_PCT=${STOCK_FUTURES_LIMIT_BUFFER_PCT:-0.05}
      - STOCK_FUTURES_TARGET_PCT=${STOCK_FUTURES_TARGET_PCT:-0.0225}
      - STOCK_FUTURES_SL_PCT=${STOCK_FUTURES_SL_PCT:-0.010}
      - STOCK_FUTURES_VOL_THRESHOLD=${STOCK_FUTURES_VOL_THRESHOLD:-1.5}
      - STOCK_FUTURES_ENTRY_CUTOFF=${STOCK_FUTURES_ENTRY_CUTOFF:-13:00}
      - STOCK_FUTURES_SQUAREOFF_TIME=${STOCK_FUTURES_SQUAREOFF_TIME:-15:00}
      - STOCK_FUTURES_STATE_FILE=/app/data/stock_futures_trades_today.json
      - STOCK_FUTURES_POLL=${STOCK_FUTURES_POLL:-15}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    # Override default entrypoint to run the Nifty 200 Momentum 30 Stock Futures Desk
    entrypoint: ["python", "scripts/run_stock_futures_desk.py"]
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production (2 Lots, Marketable Limit Orders with 5% Freak-Trade Protection, 2.25% Target, 1.0% SL, 1.5x Vol Filter, 13:00 Cutoff, 15:00 EOD):
    command: ["--live", "--lots", "2", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--target-pct", "0.0225", "--sl-pct", "0.010", "--vol-threshold", "1.5", "--entry-cutoff", "13:00", "--loop"]
    #
    # 2. Paper Trading Simulation:
    # command: ["--paper", "--lots", "2", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--target-pct", "0.0225", "--sl-pct", "0.010", "--vol-threshold", "1.5", "--entry-cutoff", "13:00", "--loop"]
    # -----------------------------------------------------------------------------------

  max-oi-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_oi_scanner
    image: ${DOCKER_USER:-sharadprsn}/max_oi_scanner:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
      - MAX_OI_PROXIMITY_PCT=${MAX_OI_PROXIMITY_PCT:-0.02}
      - MAX_OI_UNWINDING_PCT=${MAX_OI_UNWINDING_PCT:-0.20}
      - MAX_OI_SL_PCT=${MAX_OI_SL_PCT:-0.50}
      - MAX_OI_HOLDING_DAYS=${MAX_OI_HOLDING_DAYS:-2}
      - MAX_OI_POLL=${MAX_OI_POLL:-60}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_max_oi_scanner.py"]
    command: ["--loop"]

  techno-funda-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techno_funda_scanner
    image: ${DOCKER_USER:-sharadprsn}/techno_funda_scanner:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
      - TECHNO_FUNDA_SCAN_TIME=${TECHNO_FUNDA_SCAN_TIME:-15:15}
      - TECHNO_FUNDA_MONTHLY_RSI=${TECHNO_FUNDA_MONTHLY_RSI:-60.0}
      - TECHNO_FUNDA_WEEKLY_RSI=${TECHNO_FUNDA_WEEKLY_RSI:-60.0}
      - TECHNO_FUNDA_DAILY_RSI=${TECHNO_FUNDA_DAILY_RSI:-65.0}
      - TECHNO_FUNDA_MIN_GROWTH=${TECHNO_FUNDA_MIN_GROWTH:-0.30}
      - TECHNO_FUNDA_MAX_DE=${TECHNO_FUNDA_MAX_DE:-1.0}
      - TECHNO_FUNDA_POLL=${TECHNO_FUNDA_POLL:-30}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_techno_funda_scanner.py"]
    command: ["--loop"]


