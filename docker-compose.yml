services:
  strangle-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifty_strangle_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount data directory so trades_today.json state and logs persist across container restarts
      - ./data:/app/data
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Incubation (1 Lot, Rs 1k Max Loss per leg, Marketable Limit Orders):
    command: ["--live", "--lots", "1", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "1000"]
    #
    # 2. Live Production (10 Lots, Rs 10k Max Loss per leg):
    # command: ["--live", "--lots", "10", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "10000"]
    #
    # 3. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "10", "--poll", "5"]
    # -----------------------------------------------------------------------------------
