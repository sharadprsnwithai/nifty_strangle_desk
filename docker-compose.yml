services:
  strangle-desk:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nifty_strangle_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Mount data directory so trades_today.json state persists across container restarts
      - ./data:/app/data
      # Mount logs directory so detailed event logs persist directly on the host machine
      - ./logs:/app/logs
      # Mount .env so generated Kite access tokens stay synchronized between host and container
      - ./.env:/app/.env
      # Code is baked into the image; rebuild to apply code changes: docker compose up -d --build
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production (2 Lots Starter, 10:00 -> 15:15 IST, 70% Single-Leg SL, No Max-Loss Cap, Roll Untested Leg, Morning Filter, Max ADR14 220, ATR Strikes):
    command: ["--live", "--lots", "2", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--no-max-loss", "--single-leg-exit", "--leg-sl-pct", "0.70", "--no-trail-cost", "--roll-untested", "--entry-time", "10:00", "--exit-time", "15:15", "--morning-filter", "--morning-filter-pct", "0.60", "--max-adr14", "220", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 2. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "12", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--no-max-loss", "--single-leg-exit", "--leg-sl-pct", "0.70", "--no-trail-cost", "--roll-untested", "--entry-time", "10:00", "--exit-time", "15:15", "--morning-filter", "--morning-filter-pct", "0.60", "--max-adr14", "220", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 2. Live Conservative / Re-entry (5 Lots, Rs 5k Risk Cap, Single-Leg Exit + Cost Trailing):
    # command: ["--live", "--lots", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "5000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 3. Live Incubation (1 Lot, Rs 1k Portfolio Max Loss, Marketable Limit Orders):
    # command: ["--live", "--lots", "1", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "1000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 4. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "10", "--poll", "5", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    # -----------------------------------------------------------------------------------

  etf-swing-desk:
    build:
      context: .
      dockerfile: Dockerfile
      target: etf
    container_name: etf_swing_desk
    image: ${DOCKER_USER:-sharadprsn}/etf_swing_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_weekly_etf_desk.py"]
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production Execution (Active: Rs 10 Lakhs, 3 Slots, Friday 15:20 Scan + Monday 09:16 Rebalance):
    command: ["--live", "--capital", "1000000", "--slots", "3", "--loop"]
    #
    # 2. Paper Trading Simulation:
    # command: ["--paper", "--capital", "1000000", "--slots", "3", "--loop"]
    # -----------------------------------------------------------------------------------

  directional-orb-desk:
    build:
      context: .
      dockerfile: Dockerfile
      target: directional-orb
    container_name: nifty_directional_orb_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_directional_orb_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_directional_orb_desk.py"]
    # 1. Live Production (2 Lots Starter, 09:45 ORB, 5m/15m RSI>50 Entry Only, 100 OTM, 50% SL, 6k Cap, 5s poll):
    command: ["--live", "--lots", "2", "--orb-end", "09:45", "--poll", "5", "--otm-offset", "100", "--leg-sl-pct", "0.50", "--max-loss", "6000", "--min-adx", "20", "--max-orb-width-pct", "0.65", "--exit-time", "15:15"]
    # 2. Live Production:
    # command: ["--live", "--lots", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--orb-end", "09:45", "--otm-offset", "100", "--leg-sl-pct", "0.50", "--min-adx", "20", "--max-orb-width-pct", "0.65", "--exit-time", "15:15"]



