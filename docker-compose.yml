services:
  strangle-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifty_strangle_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Mount data directory so trades_today.json state persists across container restarts
      - ./data:/app/data
      # Mount logs directory so detailed event logs persist directly on the host machine
      - ./logs:/app/logs
      # Mount .env so generated Kite access tokens stay synchronized between host and container
      - ./.env:/app/.env
      # Code is baked into the image; rebuild to apply code changes: docker compose up -d --build
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production (10 Lots, Single-Leg Exit + Cost Trailing, Morning Trend Filter, ATR Strikes):
    command: ["--live", "--lots", "10", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "10000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 2. Live Conservative / Re-entry (5 Lots, Rs 5k Risk Cap, Single-Leg Exit + Cost Trailing):
    # command: ["--live", "--lots", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "5000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 3. Live Incubation (1 Lot, Rs 1k Portfolio Max Loss, Marketable Limit Orders):
    # command: ["--live", "--lots", "1", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "1000", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    #
    # 4. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "10", "--poll", "5", "--single-leg-exit", "--trail-cost", "--morning-filter", "--morning-filter-pct", "0.60", "--strike-mode", "ATR", "--atr-multiplier", "1.25"]
    # -----------------------------------------------------------------------------------

  etf-swing-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf_swing_desk
    image: ${DOCKER_USER:-sharadprsn}/etf_swing_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_weekly_etf_desk.py"]
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production Execution (Active: Rs 10 Lakhs, 3 Slots, Friday 15:20 Scan + Monday 09:16 Rebalance):
    command: ["--live", "--capital", "1000000", "--slots", "3", "--loop"]
    #
    # 2. Paper Trading Simulation:
    # command: ["--paper", "--capital", "1000000", "--slots", "3", "--loop"]
    # -----------------------------------------------------------------------------------

  silver-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silver_desk
    image: ${DOCKER_USER:-sharadprsn}/silver_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-5}
      - SILVER_MODE=LIVE
      - SILVER_LOTS=${SILVER_LOTS:-2}
      - SILVER_SL_PER_LOT=${SILVER_SL_PER_LOT:-3000.0}
      - SILVER_SL_PCT=${SILVER_SL_PCT:-0.40}
      - SILVER_STRIKE_OTM_PCT=${SILVER_STRIKE_OTM_PCT:-0.015}
      - SILVER_ENTRY_TIME=${SILVER_ENTRY_TIME:-20:00}
      - SILVER_EXIT_TIME=${SILVER_EXIT_TIME:-23:10}
      - SILVER_STATE_FILE=/app/data/silver_trades_today.json
      - SILVER_POLL_SECONDS=${SILVER_POLL_SECONDS:-5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    entrypoint: ["python", "scripts/run_silver_desk.py"]
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production Execution (Active: Configurable lots, SL calculated from number of lots):
    command: ["--live", "--lots", "2", "--sl-per-lot", "3000.0", "--sl-pct", "0.40", "--strike-otm-pct", "0.015", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--entry-time", "20:00", "--exit-time", "23:10", "--loop"]
    #
    # 2. Paper Trading Simulation:
    # command: ["--paper", "--lots", "2", "--sl-per-lot", "3000.0", "--sl-pct", "0.40", "--strike-otm-pct", "0.015", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--entry-time", "20:00", "--exit-time", "23:10", "--loop"]
    # -----------------------------------------------------------------------------------



