  orb-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orb_breakout_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    entrypoint: ["python", "run_orb.py"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-10}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    # -----------------------------------------------------------------------------------
    # Option 3 Desk (Static 30 Stocks Universe):
    # - Sizing: 2 Lots per stock (50% booked @ 1:1 R target, remaining 50% runner to 15:00)
    # - Portfolio Circuit Breaker: Hard halt at -Rs 50,000 daily loss (for 2 lots)
    # - Max Trades Cap: 5 trades per day
    # - Marketable LIMIT execution with 0.2% price buffer
    #
    # 1. Paper Trading Mode (2 Lots simulated execution + Telegram alerts):
    command: ["--paper", "--sizing-mode", "LOTS", "--lots", "2", "--daily-loss", "50000", "--max-trades", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.002", "--poll", "5"]
    #
    # 2. Paper Trading Mode (Fixed Risk ₹2,500 Risk-Parity):
    # command: ["--paper", "--sizing-mode", "FIXED_RISK", "--risk", "2500", "--daily-loss", "10000", "--max-trades", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.002", "--poll", "5"]
    #
    # 3. Live Production Mode (Real Broker Order Execution via Kite Connect API + Telegram Alerts):
    # command: ["--live", "--sizing-mode", "LOTS", "--lots", "2", "--daily-loss", "50000", "--max-trades", "5", "--order-type", "LIMIT", "--limit-buffer-pct", "0.002", "--poll", "5"]
    # -----------------------------------------------------------------------------------

  silver-orb-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silver_orb_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    entrypoint: ["python", "run_silver_orb.py"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-10}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    # -----------------------------------------------------------------------------------
    # MCX Silver Mini 18:00 US Session Desk (4-Lot Tranche Scaling):
    # - Contract: Auto-resolves near-month SILVERM (5 kg lot)
    # - Setup: 17:45 - 18:00 reference range, 50 EMA trend filter on 15m
    # - Risk: 4 Lots (20 kg), SL: 500 pts (Rs 10,000 risk)
    # - Tranche: Tranche 1 (2 Lots) booked @ +800 pts (+Rs 8,000), Tranche 2 (2 Lots) trailed to Cost & rides to 22:45
    # - Telegram Notifications: Strictly on Entry, SL, and Exit with Total Day P&L
    #
    # 1. Paper Trading Mode:
    # command: ["--paper", "--lots", "4", "--sl", "500", "--target1", "800", "--order-type", "LIMIT", "--limit-buffer-pts", "80.0", "--poll", "5"]
    #
    # 2. Live Production Mode (Real Broker Order Execution via Kite Connect API + Telegram Alerts):
    command: ["--live", "--lots", "4", "--sl", "500", "--target1", "800", "--order-type", "LIMIT", "--limit-buffer-pts", "80.0", "--poll", "5"]
    # -----------------------------------------------------------------------------------


