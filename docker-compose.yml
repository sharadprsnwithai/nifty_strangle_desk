services:
  strangle-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifty_strangle_desk
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount data directory so trades_today.json state persists across container restarts
      - ./data:/app/data
      # Mount logs directory so detailed event logs persist directly on the host machine
      - ./logs:/app/logs
      # Mount .env so generated Kite access tokens stay synchronized between host and container
      - ./.env:/app/.env
      # Mount codebase so updates are immediately active in the container
      - ./strategy:/app/strategy
      - ./run_strategy.py:/app/run_strategy.py
      - ./run_positional_condor.py:/app/run_positional_condor.py
    # -----------------------------------------------------------------------------------
    # Command Options:
    # 1. Live Production (10 Lots, Rs 10k Portfolio Max Loss):
    command: ["--live", "--lots", "10", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "10000"]
    #
    # 2. Live Incubation (1 Lot, Rs 1k Portfolio Max Loss, Marketable Limit Orders):
    # command: ["--live", "--lots", "1", "--order-type", "LIMIT", "--limit-buffer-pct", "0.05", "--max-loss", "1000"]
    #
    # 3. Paper Trading (Simulation):
    # command: ["--paper", "--lots", "10", "--poll", "5"]
    # -----------------------------------------------------------------------------------

  positional-condor-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifty_positional_condor
    image: ${DOCKER_USER:-sharadprsn}/nifty_strangle_desk:latest
    restart: unless-stopped
    entrypoint: ["python", "run_positional_condor.py"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    # -----------------------------------------------------------------------------------
    # Positional Condor Automated Daemon (Runs continuous 15:20 IST daily scheduler):
    # Paper Simulation:
    # command: ["--paper", "--lots", "1", "--monthly-stop-loss", "0.03", "--monthly-target", "0.04", "--schedule-time", "15:20"]
    # Live Production:
    command: ["--live", "--lots", "1", "--monthly-stop-loss", "0.03", "--monthly-target", "0.04", "--schedule-time", "15:20"]
    # -----------------------------------------------------------------------------------
