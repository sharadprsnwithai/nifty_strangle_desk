[project]
name = "sharads-intraday-option-selling-desk"
version = "0.1.0"
description = "Intraday option selling desk with Kite Connect API and TOTP authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kiteconnect>=5.0.0",
    "pyotp>=2.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

